<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #222; }

  /* ── ПАНЕЛЬ УПРАВЛЕНИЯ ── */
  .controls {
    background: #1d3557; color: #fff;
    padding: 16px 24px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .controls h1 { font-size: 1rem; flex: 1; }
  .btn {
    padding: 8px 18px; border: none; border-radius: 8px;
    cursor: pointer; font-size: .85rem; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-green  { background: #1db954; color: #fff; }
  .btn-red    { background: #e63946; color: #fff; }
  .btn-blue   { background: #457b9d; color: #fff; }
  .btn-gray   { background: #6c757d; color: #fff; }

  /* ── ФИЛЬТРЫ ── */
  .filter-bar {
    background: #fff; padding: 10px 24px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    border-bottom: 1px solid #e0e0e0;
  }
  select, input[type=text] {
    padding: 7px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: .83rem; outline: none;
  }
  .count-lbl { font-size: .83rem; color: #666; margin-left: auto; }

  /* ── ТАБЫ ── */
  .tabs {
    display: flex; background: #fff;
    border-bottom: 2px solid #e0e0e0;
    padding: 0 24px;
  }
  .tab {
    padding: 14px 22px; cursor: pointer;
    font-size: .9rem; font-weight: 600;
    color: #888; border-bottom: 3px solid transparent;
    margin-bottom: -2px; transition: all .2s;
    display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: #1d3557; }
  .tab.active-review    { color: #1d3557; border-bottom-color: #1d3557; }
  .tab.active-complaint { color: #e63946; border-bottom-color: #e63946; }
  .tab.active-both      { color: #6a1b9a; border-bottom-color: #6a1b9a; }

  /* ── СЕТКА ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px; padding: 20px 24px;
  }
  .grid.two-col { grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); }

  /* ══════════════════════════════
     НАКЛЕЙКА: ОТЗЫВ (синяя)
  ══════════════════════════════ */
  .sticker-review {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    border: 2.5px solid #1d3557;
    page-break-inside: avoid; break-inside: avoid;
  }
  .sticker-review .s-top {
    background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%);
    color: #fff; padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .sticker-review .s-body { padding: 14px 16px; text-align: center; }
  .sticker-review .s-msg {
    font-size: .82rem; color: #333; line-height: 1.55;
    margin-bottom: 10px;
  }
  .sticker-review .s-msg b { color: #1d3557; }
  .sticker-review .s-cta {
    background: #1d3557; color: #fff;
    border-radius: 20px; padding: 7px 18px;
    font-size: .8rem; font-weight: 700;
    display: inline-block; margin-top: 6px;
  }
  .sticker-review .s-sub { font-size: .68rem; color: #1db954; font-weight: 700; margin-top: 5px; }

  /* ══════════════════════════════
     НАКЛЕЙКА: ЖАЛОБА (красная)
  ══════════════════════════════ */
  .sticker-complaint {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    border: 2.5px solid #e63946;
    page-break-inside: avoid; break-inside: avoid;
  }
  .sticker-complaint .s-top {
    background: linear-gradient(135deg, #c0392b 0%, #e63946 100%);
    color: #fff; padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .sticker-complaint .s-body { padding: 14px 16px; text-align: center; }
  .sticker-complaint .s-msg {
    font-size: .82rem; color: #333; line-height: 1.55;
    margin-bottom: 10px;
  }
  .sticker-complaint .s-msg b { color: #c0392b; }
  .sticker-complaint .s-cta {
    background: #e63946; color: #fff;
    border-radius: 20px; padding: 7px 18px;
    font-size: .8rem; font-weight: 700;
    display: inline-block; margin-top: 6px;
  }
  .sticker-complaint .s-sub { font-size: .68rem; color: #e63946; font-weight: 700; margin-top: 5px; }

  /* ══════════════════════════════
     НАКЛЕЙКА: ОБЕ (двойная)
  ══════════════════════════════ */
  .sticker-pair {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    border: 2px solid #e0e0e0;
    page-break-inside: avoid; break-inside: avoid;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .sticker-pair .pair-left  {
    border-right: 2px dashed #e0e0e0;
    background: #f8faff;
  }
  .sticker-pair .pair-right { background: #fff8f8; }
  .sticker-pair .pair-header {
    padding: 10px 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: .72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .5px;
  }
  .pair-header.blue { background: #1d3557; color: #fff; }
  .pair-header.red  { background: #e63946; color: #fff; }
  .pair-body { padding: 10px 12px; text-align: center; }
  .pair-msg { font-size: .75rem; color: #444; line-height: 1.5; margin-bottom: 8px; }
  .pair-cta {
    display: inline-block; border-radius: 20px; padding: 5px 14px;
    font-size: .73rem; font-weight: 700; color: #fff; margin-top: 4px;
  }
  .pair-cta.blue { background: #1d3557; }
  .pair-cta.red  { background: #e63946; }
  .pair-sub { font-size: .64rem; margin-top: 4px; }
  .pair-sub.blue { color: #1db954; }
  .pair-sub.red  { color: #e63946; }

  /* Общий блок нижней части */
  .s-bottom {
    background: #f8f9fa; border-top: 1px solid #eee;
    padding: 8px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sticker-pair .s-bottom { grid-column: 1 / -1; }
  .s-addr { font-size: .68rem; color: #555; line-height: 1.4; flex: 1; text-align: left; }
  .s-addr b { color: #222; }
  .s-tags { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .city-tag {
    font-size: .64rem; font-weight: 700; padding: 2px 7px; border-radius: 20px;
  }
  .almaty  { background: #e3f2fd; color: #1565c0; }
  .astana  { background: #f3e5f5; color: #6a1b9a; }
  .kaskel  { background: #e8f5e9; color: #2e7d32; }
  .rvm-tag {
    font-size: .63rem; color: #aaa; font-weight: 700;
    background: #eee; border-radius: 20px; padding: 2px 7px;
  }

  /* QR обёртка */
  .qr-box {
    display: flex; justify-content: center; margin: 8px 0;
  }
  .qr-box canvas, .qr-box img {
    border-radius: 8px !important;
    border: 3px solid currentColor !important;
    padding: 3px; background: #fff;
  }
  .qr-arrow { font-size: .68rem; color: #888; margin: 4px 0; }
  .logo-icon { font-size: 1.4rem; }
  .brand-name { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .5px; opacity: .9; }
  .brand-sub  { font-size: .62rem; opacity: .75; margin-top: 1px; }

  /* ── ПЕЧАТЬ ── */
  @media print {
    .controls, .filter-bar, .tabs { display: none !important; }
    body { background: #fff; }
    .grid {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 10px; padding: 8px;
    }
    .sticker-review, .sticker-complaint, .sticker-pair {
      box-shadow: none; border-width: 2px;
    }
    @page { size: A4; margin: 8mm; }
  }
</style>

];

// ── СОСТОЯНИЕ ─────────────────────────────────────
let currentTab = 'review';

function cityClass(c) {
  return c==='Астана'?'astana':c==='Каскелен'?'kaskel':'almaty';
}
function gisUrl(p) {
  const c = p.city==='Астана'?'astana':'almaty';
  return 'https://2gis.kz/'+c+'/search/'+encodeURIComponent(p.loc+' '+p.addr);
}
function cmpUrl(p) {
  return BASE+'/complaint.html?rvm='+p.rvm;
}

// ── ТАБЫ ──────────────────────────────────────────
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.className = 'tab');
  document.getElementById('tab-'+tab).className = 'tab active-'+tab;
  const grid = document.getElementById('grid');
  grid.className = tab==='both' ? 'grid two-col' : 'grid';
  render();
}

// ── РЕНДЕР ────────────────────────────────────────
function render() {
  const city   = document.getElementById('cityFilter').value;
  const search = document.getElementById('searchInput').value.toLowerCase();
  const large  = document.getElementById('sizeFilter').value === 'large';
  const sz     = large ? 160 : 120;

  const list = POINTS.filter(p =>
    (!city   || p.city === city) &&
    (!search || p.loc.toLowerCase().includes(search) || p.addr.toLowerCase().includes(search))
  );

  document.getElementById('countLbl').textContent = 'Наклеек: ' + list.length;

  const grid = document.getElementById('grid');

  if (currentTab === 'review') {
    grid.innerHTML = list.map(p => reviewSticker(p, sz)).join('');
    list.forEach(p => makeQR('qr-r-'+p.rvm, gisUrl(p), sz, '#1d3557'));

  } else if (currentTab === 'complaint') {
    grid.innerHTML = list.map(p => complaintSticker(p, sz)).join('');
    list.forEach(p => makeQR('qr-c-'+p.rvm, cmpUrl(p), sz, '#e63946'));

  } else {
    grid.innerHTML = list.map(p => bothSticker(p, sz)).join('');
    list.forEach(p => {
      makeQR('qr-br-'+p.rvm, gisUrl(p), sz, '#1d3557');
      makeQR('qr-bc-'+p.rvm, cmpUrl(p), sz, '#e63946');
    });
  }
}

function makeQR(id, url, sz, color) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  const qr = new QRCode(el, { text:url, width:sz, height:sz, colorDark:color, colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
  // Добавляем цветную рамку
  setTimeout(() => {
    const canvas = el.querySelector('canvas');
    if (canvas) { canvas.style.border='3px solid '+color; canvas.style.borderRadius='8px'; canvas.style.padding='3px'; }
  }, 50);
}

function footer(p) {
  return `<div class="s-bottom">
    <div class="s-addr"><b>${p.loc}</b><br>${p.addr}</div>
    <div class="s-tags">
      <span class="city-tag ${cityClass(p.city)}">${p.city}</span>
      <span class="rvm-tag">RVM ${p.rvm}</span>
    </div>
  </div>`;
}

// ── НАКЛЕЙКА: ОТЗЫВ ───────────────────────────────
function reviewSticker(p, sz) {
  return `<div class="sticker-review">
    <div class="s-top">
      <span class="logo-icon">♻️</span>
      <div>
        <div class="brand-name">Freedom Фандоматы</div>
        <div class="brand-sub">Сдавай пластик — береги планету</div>
      </div>
    </div>
    <div class="s-body">
      <div class="s-msg">
        Вам понравилось?<br>
        <b>Оставьте отзыв в 2ГИС</b> —<br>
        это помогает нам развиваться!
      </div>
      <div class="qr-box" id="qr-r-${p.rvm}" style="color:#1d3557"></div>
      <div class="qr-arrow">↑ Наведите камеру телефона ↑</div>
      <div class="s-cta">⭐ Оставить отзыв в 2ГИС</div>
      <div class="s-sub">🎁 Спасибо! Ваш отзыв очень важен</div>
    </div>
    ${footer(p)}
  </div>`;
}

// ── НАКЛЕЙКА: ЖАЛОБА ──────────────────────────────
function complaintSticker(p, sz) {
  return `<div class="sticker-complaint">
    <div class="s-top">
      <span class="logo-icon">🔧</span>
      <div>
        <div class="brand-name">Freedom Фандоматы</div>

    </div>
    <div class="s-body">
      <div class="s-msg">
        <b>Есть проблема с аппаратом?</b><br>
        Сообщите нам прямо сейчас —<br>
        устраним в течение <b>24 часов</b>!
      </div>
      <div class="qr-box" id="qr-c-${p.rvm}" style="color:#e63946"></div>
      <div class="qr-arrow">↑ Наведите камеру телефона ↑</div>
      <div class="s-cta">🚨 Сообщить о проблеме</div>
      <div class="s-sub">⚡ Реакция в течение 24 часов</div>
    </div>
    ${footer(p)}
  </div>`;
}

// ── НАКЛЕЙКА: ОБЕ ─────────────────────────────────
function bothSticker(p, sz) {
  const half = Math.round(sz * 0.7);
  return `<div class="sticker-pair">
    <div class="pair-left">
      <div class="pair-header blue">⭐ Отзыв в 2ГИС</div>
      <div class="pair-body">
        <div class="pair-msg">Вам понравилось?<br><b>Оставьте отзыв в 2ГИС</b> — это помогает нам развиваться!</div>
        <div class="qr-box" id="qr-br-${p.rvm}" style="color:#1d3557"></div>
        <div class="qr-arrow">↑ Наведите камеру ↑</div>
        <div class="pair-cta blue">⭐ Отзыв в 2ГИС</div>
        <div class="pair-sub blue">🎁 Спасибо!</div>
      </div>
    </div>
    <div class="pair-right">
      <div class="pair-header red">🚨 Есть проблема?</div>
      <div class="pair-body">
        <div class="pair-msg"><b>Аппарат не работает?</b><br>Сообщите нам — устраним за <b>24 часа</b>!</div>
        <div class="qr-box" id="qr-bc-${p.rvm}" style="color:#e63946"></div>
        <div class="qr-arrow">↑ Наведите камеру ↑</div>
        <div class="pair-cta red">🚨 Пожаловаться</div>
        <div class="pair-sub red">⚡ Ответим за 24ч</div>
      </div>
    </div>
    ${footer(p)}
  </div>`;
}

// ── ЗАПУСК ────────────────────────────────────────
render();
</script>
