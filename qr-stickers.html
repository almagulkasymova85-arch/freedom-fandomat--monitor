<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Freedom Фандоматы — QR-наклейки для 2ГИС</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #222; }

  /* ── УПРАВЛЕНИЕ (не печатается) ── */
  .controls {
    background: #1d3557;
    color: #fff;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .controls h1 { font-size: 1.1rem; flex: 1; }
  .btn {
    padding: 9px 20px; border: none; border-radius: 8px;
    cursor: pointer; font-size: .88rem; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-green  { background: #1db954; color: #fff; }
  .btn-blue   { background: #457b9d; color: #fff; }
  .btn-orange { background: #f4a261; color: #fff; }

  .filter-bar {
    background: #fff;
    padding: 12px 28px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid #e0e0e0;
  }
  select, input[type=text] {
    padding: 7px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: .85rem; outline: none;
  }
  .count-label { font-size: .85rem; color: #666; margin-left: auto; }

  /* ── СЕТКА НАКЛЕЕК ── */
  .sticker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    padding: 20px 28px;
  }

  /* ── ОДНА НАКЛЕЙКА ── */
  .sticker {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    border: 2px solid #e0e0e0;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .sticker-top {
    background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%);
    padding: 12px 14px 10px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sticker-logo { font-size: 1.6rem; }
  .sticker-brand { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: .9; }
  .sticker-eco   { font-size: .65rem; opacity: .7; margin-top: 1px; }

  .sticker-body  { padding: 14px; text-align: center; }
  .sticker-msg {
    font-size: .78rem;
    color: #333;
    line-height: 1.5;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .sticker-msg b { color: #1d3557; }

  .qr-wrap {
    display: flex;
    justify-content: center;
    margin: 10px 0;
  }
  .qr-wrap img, .qr-wrap canvas {
    width: 130px !important;
    height: 130px !important;
    border-radius: 8px;
    border: 3px solid #1d3557;
    padding: 4px;
    background: #fff;
  }

  .sticker-arrow {
    font-size: .72rem;
    color: #1db954;
    font-weight: 700;
    margin: 6px 0;
  }
  .sticker-cta {
    background: #1db954;
    color: #fff;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: .78rem;
    font-weight: 700;
    display: inline-block;
    margin: 6px 0;
  }

  .sticker-bottom {
    background: #f8f9fa;
    border-top: 1px solid #eee;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sticker-addr {
    font-size: .68rem;
    color: #555;
    line-height: 1.4;
    flex: 1;
    text-align: left;
  }
  .sticker-rvm {
    font-size: .65rem;
    color: #aaa;
    font-weight: 700;
    background: #eee;
    border-radius: 20px;
    padding: 2px 8px;
    white-space: nowrap;
    margin-left: 6px;
  }
  .city-badge {
    font-size: .65rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .almaty  { background: #e3f2fd; color: #1565c0; }
  .astana  { background: #f3e5f5; color: #6a1b9a; }
  .kaskel  { background: #e8f5e9; color: #2e7d32; }

  .sticker-bonus {
    font-size: .68rem;
    color: #f4a261;
    font-weight: 700;
    margin-top: 4px;
  }

  /* ── БОЛЬШОЙ ФОРМАТ (A5) ── */
  .sticker.large { min-height: 320px; }
  .sticker.large .sticker-msg { font-size: .88rem; }
  .sticker.large .qr-wrap img,
  .sticker.large .qr-wrap canvas { width: 170px !important; height: 170px !important; }
  .sticker.large .sticker-cta { font-size: .9rem; padding: 8px 22px; }

  /* ── ПЕЧАТЬ ── */
  @media print {
    .controls, .filter-bar { display: none !important; }
    body { background: #fff; }
    .sticker-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 10px;
    }
    .sticker-grid.one-per-page {
      grid-template-columns: 1fr;
    }
    .sticker {
      box-shadow: none;
      border: 2px solid #ccc;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    @page { size: A4; margin: 10mm; }
  }
</style>
</head>

  <button class="btn btn-blue" onclick="toggleSize()">📐 Размер: <span id="sizeLabel">Стандарт</span></button>
  <button class="btn btn-orange" onclick="toggleFormat()">📄 Формат: <span id="formatLabel">4 на странице</span></button>
</div>

// Уникальная ссылка на 2ГИС для каждого фандомата
function get2gisUrl(p) {
  const city = p.city === 'Астана' ? 'astana' : 'almaty';
  return `https://2gis.kz/${city}/search/${encodeURIComponent(p.loc + ' ' + p.addr)}`;
}

function cityClass(city) {
  if (city === 'Астана')    return 'astana';
  if (city === 'Каскелен')  return 'kaskel';
  return 'almaty';
}

let isLarge = false;
let onePerPage = false;

function toggleSize() {
  isLarge = !isLarge;
  document.getElementById('sizeLabel').textContent = isLarge ? 'Большой A5' : 'Стандарт';
  render();
}

function toggleFormat() {
  onePerPage = !onePerPage;
  document.getElementById('formatLabel').textContent = onePerPage ? '1 на странице' : '4 на странице';
  const grid = document.getElementById('grid');
  grid.classList.toggle('one-per-page', onePerPage);
}

function render() {
  const cityF   = document.getElementById('cityFilter').value;
  const searchF = document.getElementById('searchInput').value.toLowerCase();
  const countF  = parseInt(document.getElementById('countFilter').value) || 0;

  const filtered = POINTS.filter(p => {
    if (cityF   && p.city !== cityF) return false;
    if (countF  && p.total < countF) return false;
    if (searchF && !(p.loc.toLowerCase().includes(searchF) || p.addr.toLowerCase().includes(searchF))) return false;
    return true;
  });

  document.getElementById('countLabel').textContent = `Показано: ${filtered.length} наклеек`;

    const sizeClass = isLarge ? 'large' : '';
    return `

      <div class="sticker-top">
        <div class="sticker-logo">♻️</div>
        <div>
          <div class="sticker-brand">Freedom Фандоматы</div>
          <div class="sticker-eco">Сдавай пластик — береги планету</div>
        </div>
      </div>
      <div class="sticker-body">
        <div class="sticker-msg">
          Вам понравилось?<br>
          <b>Оставьте отзыв в 2ГИС</b> —<br>
          это помогает нам развиваться!
        </div>
        <div class="qr-wrap" id="qr-${p.rvm}"></div>
        <div class="sticker-arrow">↑ Наведите камеру телефона ↑</div>
        <div class="sticker-cta">⭐ Оставить отзыв в 2ГИС</div>
        <div class="sticker-bonus">🎁 Спасибо за каждый отзыв!</div>
      </div>
      <div class="sticker-bottom">
        <div class="sticker-addr">
          <div style="font-weight:700">${p.loc}</div>
          <div>${p.addr}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          <span class="city-badge ${cityClass(p.city)}">${p.city}</span>
          <span class="sticker-rvm">RVM ${p.rvm}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  // Генерируем QR-коды
  filtered.forEach(p => {
    const url = get2gisUrl(p);
    const el  = document.getElementById(`qr-${p.rvm}`);
    if (!el) return;
    el.innerHTML = '';
    new QRCode(el, {
      text:          url,
      width:         isLarge ? 170 : 130,
      height:        isLarge ? 170 : 130,
      colorDark:     '#1d3557',
      colorLight:    '#ffffff',
      correctLevel:  QRCode.CorrectLevel.M
    });
  });
}

// Запуск
render();
</script>
</body>
</html>
